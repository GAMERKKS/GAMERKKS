<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=index.html#products" />
  <title>Products | ShopEase</title>
  <style>
    :root { --ink: #17201b; --muted: #718078; --accent: #a95d38; --paper: #f5f1eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 20%, #fffdf9 0, transparent 30%), linear-gradient(135deg, #f5f1eb, #e8eee7); color: var(--ink); font: 16px Arial, sans-serif; }
    main { width: min(620px, 90%); padding: clamp(38px, 8vw, 72px) 36px; text-align: center; border: 1px solid #e4ddd3; background: rgba(251, 249, 245, 0.9); box-shadow: 18px 18px 0 rgba(199, 121, 79, 0.14), 0 18px 45px rgba(39, 48, 41, 0.11); }
    .mark { margin: 0 0 14px; color: var(--accent); font: 700 13px Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font: clamp(42px, 8vw, 64px) Georgia, serif; letter-spacing: -2px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    a { display: inline-block; padding: 14px 20px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; transition: transform .2s ease, background .2s ease; }
    a:hover { background: var(--accent); transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <p class="mark">The collection</p>
    <h1>ShopEase</h1>
    <p>Opening the full product collection...</p>
    <a href="index.html#products">Continue to all products</a>
  </main>
</body>
</html>
